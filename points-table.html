<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Points Table — Cricket Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body data-page="points">

<div class="app-topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-link text-white d-none" id="menuBtn" data-bs-toggle="offcanvas" data-bs-target="#adminOffcanvas"><i class="bi bi-list fs-4"></i></button>
    <div class="brand">🏏 <div>Points Table</div></div>
  </div>
</div>

<div class="offcanvas offcanvas-start" id="adminOffcanvas">
  <div class="offcanvas-header"><h5>Admin Menu</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body d-flex flex-column gap-1" id="adminNavList"></div>
</div>

<div class="container-app py-3">
  <ul class="nav nav-tabs mb-3" id="pointsTabs">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabStandings">Points Table</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabStats">Top Stats</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tabStandings">
      <div class="card-app">
        <div class="table-responsive">
          <table class="table points-table mb-0">
            <thead>
              <tr><th>#</th><th>Team</th><th class="text-end">P</th><th class="text-end">W</th><th class="text-end">L</th><th class="text-end">NR</th><th class="text-end">Pts</th><th class="text-end">NRR</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="tabStats">
      <div class="section-heading mt-0">🏏 Most Runs</div>
      <div class="card-app" id="statRuns"></div>
      <div class="section-heading">🎯 Most Wickets</div>
      <div class="card-app" id="statWickets"></div>
      <div class="section-heading">4️⃣ Most Fours</div>
      <div class="card-app" id="statFours"></div>
      <div class="section-heading">6️⃣ Most Sixes</div>
      <div class="card-app" id="statSixes"></div>
    </div>
  </div>
</div>

<div id="bottomNav"></div>

<script type="module">
  import { requireRole } from "./auth.js";
  import { renderBottomNav, renderAdminNav, $, initials } from "./app.js";
  import { computeStandings, computePlayerStats } from "./points.js";
  import { teamLogoImg } from "./teams.js";
  import { getDefaultTournament } from "./tournament.js";

  const { profile } = await requireRole("any");
  if (profile.role === "admin") {
    renderAdminNav("points");
    $("#menuBtn").classList.remove("d-none");
    document.body.classList.add("no-bottom-nav");
  } else {
    renderBottomNav("points");
  }

  const tournament = await getDefaultTournament();
  const standings = await computeStandings(tournament?.id);

  const rows = $("#rows");
  if (!standings.length) {
    rows.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">No completed matches yet</td></tr>`;
  } else {
    rows.innerHTML = standings.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td class="d-flex align-items-center gap-2">${teamLogoImg(r, "team-logo-sm")}<span class="fw-semibold">${r.shortName || r.name}</span></td>
        <td class="text-end">${r.played}</td>
        <td class="text-end">${r.won}</td>
        <td class="text-end">${r.lost}</td>
        <td class="text-end">${r.noResult}</td>
        <td class="text-end fw-bold">${r.points}</td>
        <td class="text-end">${r.nrr >= 0 ? "+" : ""}${r.nrr.toFixed(3)}</td>
      </tr>`).join("");
  }

  function playerRow(p, valueLabel, value) {
    const initialsText = initials(p.name);
    const avatar = p.photoUrl
      ? `<img src="${p.photoUrl}" class="team-logo team-logo-sm" alt="${p.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'team-logo team-logo-sm avatar-fallback d-flex',textContent:'${initialsText}'}))">`
      : `<div class="team-logo team-logo-sm avatar-fallback d-flex">${initialsText}</div>`;
    return `<div class="list-row">
      ${avatar}
      <div class="flex-grow-1">
        <div class="fw-semibold">${p.name}</div>
        <div class="small text-muted">${p.teamShortName || ""}</div>
      </div>
      <div class="fw-bold display-font">${value}</div>
    </div>`;
  }

  function renderLeaderboard(mountId, list, key, formatter) {
    const mount = $(mountId);
    if (!list.length) {
      mount.innerHTML = `<p class="text-muted small mb-0 py-2">No data yet</p>`;
      return;
    }
    mount.innerHTML = list.map((p) => playerRow(p, key, formatter ? formatter(p) : p[key])).join("");
  }

  const stats = await computePlayerStats(tournament?.id);
  renderLeaderboard("#statRuns", stats.topRuns, "runs", (p) => `${p.runs} <span class="small text-muted fw-normal">(${p.balls}b)</span>`);
  renderLeaderboard("#statWickets", stats.topWickets, "wickets");
  renderLeaderboard("#statFours", stats.topFours, "fours");
  renderLeaderboard("#statSixes", stats.topSixes, "sixes");
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
