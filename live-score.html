<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Score — Cricket Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body data-page="matches">

<div class="app-topbar">
  <div class="d-flex align-items-center gap-2">
    <a href="matches.html" class="text-white"><i class="bi bi-arrow-left fs-5"></i></a>
    <div class="brand">🏏 <div>Match Center</div></div>
  </div>
</div>

<div class="container-app py-3" id="content">
  <div class="skel" style="height:200px;"></div>
</div>

<div id="bottomNav"></div>

<script type="module">
  import { requireRole } from "./auth.js";
  import { renderBottomNav, $, ballsToOvers, formatDateTime, statusBadge } from "./app.js";
  import { getMatch, listenMatch } from "./matches.js";
  import { getTeam, teamLogoImg } from "./teams.js";
  import { listPlayers } from "./players.js";

  const { profile } = await requireRole("any");
  if (profile.role !== "admin") renderBottomNav("matches");

  const matchId = new URLSearchParams(location.search).get("id");
  if (!matchId) { $("#content").innerHTML = "<p>No match specified.</p>"; throw new Error("no id"); }

  let match = await getMatch(matchId);
  const teamA = await getTeam(match.teamAId);
  const teamB = await getTeam(match.teamBId);
  const playersA = await listPlayers(match.teamAId);
  const playersB = await listPlayers(match.teamBId);
  const playersMap = {};
  [...playersA, ...playersB].forEach((p) => playersMap[p.id] = p);

  let countdownTimer;

  function render() {
    const content = $("#content");
    if (match.status === "UPCOMING") {
      content.innerHTML = upcomingView();
    } else if (match.status === "PLAYING_XI") {
      content.innerHTML = playingXiView();
      startCountdown();
    } else {
      content.innerHTML = liveView();
    }
  }

  function headerRow() {
    return `<div class="d-flex justify-content-between align-items-center mb-3">
      <span class="small text-muted">Match ${match.matchNumber ?? ""} · ${formatDateTime(match.date ? `${match.date}T${match.time || "00:00"}` : null)}</span>
      ${statusBadge(match.status)}
    </div>
    <div class="d-flex align-items-center justify-content-around mb-2">
      <div class="text-center">${teamLogoImg(teamA, "team-logo-lg")}<div class="small fw-semibold mt-1">${teamA?.name || "Team A"}</div></div>
      <div class="text-muted small">VS</div>
      <div class="text-center">${teamLogoImg(teamB, "team-logo-lg")}<div class="small fw-semibold mt-1">${teamB?.name || "Team B"}</div></div>
    </div>
    <div class="small text-muted text-center mb-3"><i class="bi bi-geo-alt"></i> ${match.venue || "Venue TBD"}</div>`;
  }

  function upcomingView() {
    return `<div class="card-app">${headerRow()}<p class="text-center text-muted small mb-0">Playing XI has not been selected yet.</p></div>`;
  }

  function playingXiView() {
    const announced = match.playingXIAnnounced;
    let body;
    if (announced) {
      const xiA = (match.playingXI?.[match.teamAId] || []).map((id) => playersMap[id]).filter(Boolean);
      const xiB = (match.playingXI?.[match.teamBId] || []).map((id) => playersMap[id]).filter(Boolean);
      body = `
        <div class="alert alert-success small"><i class="bi bi-fire"></i> Playing XI announced</div>
        <div class="row">
          <div class="col-6">
            <h6>${teamA?.shortName || teamA?.name}</h6>
            <ol class="small ps-3">${xiA.map((p) => `<li>${p.name}${p.id === teamA?.captainId ? " (C)" : ""}</li>`).join("")}</ol>
          </div>
          <div class="col-6">
            <h6>${teamB?.shortName || teamB?.name}</h6>
            <ol class="small ps-3">${xiB.map((p) => `<li>${p.name}</li>`).join("")}</ol>
          </div>
        </div>`;
    } else if (match.playingXIAnnounceAt) {
      body = `<div class="text-center py-3">
        <div class="small text-muted mb-1">PLAYING XI ANNOUNCEMENT IN</div>
        <div class="countdown-box" id="countdownBox">--:--</div>
      </div>`;
    } else {
      body = `<p class="text-center text-muted small mb-0">Playing XI selection is in progress. Check back soon.</p>`;
    }
    return `<div class="card-app">${headerRow()}${body}</div>`;
  }

  function startCountdown() {
    clearInterval(countdownTimer);
    if (!match.playingXIAnnounceAt) return;
    const target = new Date(match.playingXIAnnounceAt).getTime();
    const tick = () => {
      const box = document.getElementById("countdownBox");
      if (!box) { clearInterval(countdownTimer); return; }
      const diff = Math.max(0, target - Date.now());
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      box.textContent = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    };
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  function liveView() {
    clearInterval(countdownTimer);
    const innings1 = match.innings1, innings2 = match.innings2;
    const battingTeam1 = innings1 ? (innings1.battingTeamId === match.teamAId ? teamA : teamB) : null;
    const battingTeam2 = innings2 ? (innings2.battingTeamId === match.teamAId ? teamA : teamB) : null;

    let html = `<div class="live-card mb-3">`;
    if (match.status === "LIVE") html += `<span class="live-pill"><span class="live-dot"></span> LIVE</span>`;
    if (match.status === "COMPLETED") html += `<span class="badge text-bg-success">COMPLETED</span>`;
    if (match.status === "INNINGS_BREAK") html += `<span class="badge text-bg-warning">INNINGS BREAK</span>`;

    if (innings1) {
      html += `<div class="live-teamrow"><span class="team-name text-white">${battingTeam1?.name}</span></div>
      <div class="d-flex justify-content-between align-items-baseline">
        <span class="score">${innings1.runs}/${innings1.wickets}</span>
        <span class="overs">${ballsToOvers(innings1.legalBalls)} OV</span>
      </div>`;
    }
    if (innings2) {
      html += `<div class="live-vs">·</div>
      <div class="live-teamrow"><span class="team-name text-white">${battingTeam2?.name}</span></div>
      <div class="d-flex justify-content-between align-items-baseline">
        <span class="score">${innings2.runs}/${innings2.wickets}</span>
        <span class="overs">${ballsToOvers(innings2.legalBalls)} OV</span>
      </div>`;
    }
    if (match.status === "COMPLETED" && match.result) {
      html += `<div class="text-center mt-2 fw-semibold text-warning">${match.result}</div>`;
    }
    html += `</div>`;

    const liveInnings = match.currentInnings === 2 ? innings2 : innings1;
    if (liveInnings && (match.status === "LIVE")) {
      const strikerB = liveInnings.batsmen[liveInnings.strikerId];
      const nonStrikerB = liveInnings.batsmen[liveInnings.nonStrikerId];
      const bw = liveInnings.bowlers[liveInnings.bowlerId];
      html += `<div class="card-app mb-3">
        <div class="d-flex justify-content-between small">
          <span>${playersMap[liveInnings.strikerId]?.name || "-"}* <strong>${strikerB ? `${strikerB.runs} (${strikerB.balls})` : ""}</strong></span>
          <span>${playersMap[liveInnings.nonStrikerId]?.name || "-"} <strong>${nonStrikerB ? `${nonStrikerB.runs} (${nonStrikerB.balls})` : ""}</strong></span>
        </div>
        <div class="small text-muted mt-1">${playersMap[liveInnings.bowlerId]?.name || ""}: ${bw ? `${ballsToOvers(bw.balls)}-${bw.maidens}-${bw.runs}-${bw.wickets}` : ""}</div>
        <div class="last-balls mt-2" style="filter:none">
          ${liveInnings.lastBalls.slice(0, 8).reverse().map((b) => `<span class="ball-chip" style="background:${b.isWicket ? "var(--color-ball)" : b.display === "4" ? "var(--color-pitch-lighter)" : b.display === "6" ? "var(--color-gold)" : "#EEF2EF"};color:${b.display === "6" ? "#10201A" : b.isWicket || b.display === "4" ? "#fff" : "#10201A"}">${b.display}</span>`).join("")}
        </div>
      </div>`;
    }

    html += `<div class="text-center mb-3"><a href="scorecard.html?id=${matchId}" class="btn btn-pitch btn-sm">Full Scorecard</a></div>`;
    return html;
  }

  render();
  listenMatch(matchId, (m) => {
    if (!m) return;
    match = m;
    render();
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
