<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings — Cricket Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body data-page="settings">

<div class="app-topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-link text-white d-none" id="menuBtn" data-bs-toggle="offcanvas" data-bs-target="#adminOffcanvas"><i class="bi bi-list fs-4"></i></button>
    <div class="brand">🏏 <div>Settings</div></div>
  </div>
</div>

<div class="offcanvas offcanvas-start" id="adminOffcanvas">
  <div class="offcanvas-header"><h5>Admin Menu</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body d-flex flex-column gap-1" id="adminNavList"></div>
</div>

<div class="container-app py-3">
  <div class="card-app d-flex align-items-center gap-3 mb-3">
    <div class="team-logo team-logo-lg avatar-fallback d-flex" id="avatarInitials"></div>
    <div>
      <div class="fw-semibold" id="profileName"></div>
      <div class="small text-muted" id="profileEmail"></div>
      <span class="badge text-bg-secondary text-uppercase" id="profileRole"></span>
    </div>
  </div>

  <div class="card-app mb-3" id="adminShortcut" style="display:none">
    <a href="admin.html" class="d-flex justify-content-between align-items-center text-decoration-none">
      <span class="fw-semibold" style="color:var(--color-ink)"><i class="bi bi-speedometer2"></i> Admin Dashboard</span>
      <i class="bi bi-chevron-right" style="color:var(--color-muted)"></i>
    </a>
  </div>

  <div class="card-app">
    <div class="list-row justify-content-between">
      <span>About this app</span>
      <span class="small text-muted">Cricket Live v1.0</span>
    </div>
    <div class="list-row justify-content-between" style="cursor:pointer" id="logoutRow">
      <span class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</span>
    </div>
  </div>
</div>

<div id="bottomNav"></div>

<script type="module">
  import { requireRole, logoutUser } from "./auth.js";
  import { renderBottomNav, renderAdminNav, $, initials } from "./app.js";

  const { user, profile } = await requireRole("any");
  if (profile.role === "admin") {
    renderAdminNav("settings");
    $("#menuBtn").classList.remove("d-none");
    document.body.classList.add("no-bottom-nav");
    $("#adminShortcut").style.display = "";
  } else {
    renderBottomNav("more");
  }

  $("#profileName").textContent = profile.name || "Viewer";
  $("#profileEmail").textContent = profile.email || user.email;
  $("#profileRole").textContent = profile.role;
  $("#avatarInitials").textContent = initials(profile.name || profile.email || "?");

  $("#logoutRow").addEventListener("click", logoutUser);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
