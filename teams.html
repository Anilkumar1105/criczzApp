<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teams — Cricket Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body data-page="teams">

<div class="app-topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-link text-white d-none" id="menuBtn" data-bs-toggle="offcanvas" data-bs-target="#adminOffcanvas"><i class="bi bi-list fs-4"></i></button>
    <div class="brand">🏏 <div>Teams<small>&nbsp;</small></div></div>
  </div>
  <button class="btn btn-gold btn-sm d-none" id="addTeamBtn" data-bs-toggle="modal" data-bs-target="#teamModal"><i class="bi bi-plus-lg"></i> Team</button>
</div>

<!-- Admin offcanvas nav -->
<div class="offcanvas offcanvas-start" id="adminOffcanvas">
  <div class="offcanvas-header"><h5>Admin Menu</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body d-flex flex-column gap-1" id="adminNavList"></div>
</div>

<div class="container-app py-3">
  <div id="teamsGrid" class="row g-3"></div>
</div>

<div id="bottomNav"></div>

<!-- Team modal (admin) -->
<div class="modal fade" id="teamModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="teamModalTitle">Add Team</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="teamForm">
          <input type="hidden" id="teamId">
          <div class="mb-2"><label class="form-label">Team name</label><input class="form-control" id="teamName" required></div>
          <div class="mb-2"><label class="form-label">Short name</label><input class="form-control" id="teamShortName" maxlength="6" required></div>
          <div class="mb-2"><label class="form-label">Logo URL</label><input class="form-control" id="teamLogoUrl" placeholder="https://..."></div>
          <div class="mb-2"><label class="form-label">Banner URL</label><input class="form-control" id="teamBannerUrl" placeholder="https://..."></div>
          <div class="row">
            <div class="col-6 mb-2"><label class="form-label">Primary color</label><input type="color" class="form-control form-control-color w-100" id="teamPrimaryColor" value="#163B2C"></div>
            <div class="col-6 mb-2"><label class="form-label">Secondary color</label><input type="color" class="form-control form-control-color w-100" id="teamSecondaryColor" value="#C9971F"></div>
          </div>
          <div class="mb-2"><label class="form-label">Captain</label><input class="form-control" id="teamCaptain"></div>
          <div class="mb-2"><label class="form-label">Vice captain</label><input class="form-control" id="teamViceCaptain"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-danger me-auto d-none" id="deleteTeamBtn">Delete</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-pitch" id="saveTeamBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { requireRole } from "./auth.js";
  import { renderBottomNav, renderAdminNav, $, toast, confirmAction } from "./app.js";
  import { listTeams, createTeam, updateTeam, deleteTeam, teamLogoImg } from "./teams.js";
  import { getDefaultTournament } from "./tournament.js";

  const { profile } = await requireRole("any");
  const isAdmin = profile.role === "admin";

  if (isAdmin) {
    renderAdminNav("teams");
    $("#menuBtn").classList.remove("d-none");
    $("#addTeamBtn").classList.remove("d-none");
    document.body.classList.add("no-bottom-nav");
  } else {
    renderBottomNav("teams");
  }

  const tournament = await getDefaultTournament();
  let teamModal, teams = [];

  async function refresh() {
    teams = await listTeams(tournament?.id);
    const grid = $("#teamsGrid");
    if (!teams.length) {
      grid.innerHTML = `<div class="empty-state w-100"><i class="bi bi-people"></i>No teams yet${isAdmin ? " — tap + Team to add one" : ""}</div>`;
      return;
    }
    grid.innerHTML = teams.map((t) => `
      <div class="col-6 col-lg-4">
        <a href="players.html?team=${t.id}" class="card-app d-flex flex-column align-items-center text-center text-decoration-none h-100 position-relative">
          ${isAdmin ? `<button class="btn btn-sm btn-light position-absolute top-0 end-0 m-2 edit-team" data-id="${t.id}"><i class="bi bi-pencil"></i></button>` : ""}
          ${teamLogoImg(t, "team-logo-lg")}
          <div class="fw-semibold mt-2" style="color:var(--color-ink)">${t.name}</div>
          <div class="small text-muted">${t.shortName || ""}</div>
          <div class="small text-muted mt-1"><i class="bi bi-person-badge"></i> ${t.captain || "Captain TBD"}</div>
        </a>
      </div>`).join("");

    $$(".edit-team").forEach((btn) => btn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      openEdit(teams.find((t) => t.id === btn.dataset.id));
    }));
  }
  function $$(sel) { return [...document.querySelectorAll(sel)]; }

  function openAdd() {
    $("#teamModalTitle").textContent = "Add Team";
    $("#teamForm").reset();
    $("#teamId").value = "";
    $("#deleteTeamBtn").classList.add("d-none");
    $("#teamPrimaryColor").value = "#163B2C";
    $("#teamSecondaryColor").value = "#C9971F";
  }
  function openEdit(t) {
    $("#teamModalTitle").textContent = "Edit Team";
    $("#teamId").value = t.id;
    $("#teamName").value = t.name || "";
    $("#teamShortName").value = t.shortName || "";
    $("#teamLogoUrl").value = t.logoUrl || "";
    $("#teamBannerUrl").value = t.bannerUrl || "";
    $("#teamPrimaryColor").value = t.primaryColor || "#163B2C";
    $("#teamSecondaryColor").value = t.secondaryColor || "#C9971F";
    $("#teamCaptain").value = t.captain || "";
    $("#teamViceCaptain").value = t.viceCaptain || "";
    $("#deleteTeamBtn").classList.remove("d-none");
    teamModal.show();
  }

  if (isAdmin) {
    teamModal = new bootstrap.Modal("#teamModal");
    $("#addTeamBtn").addEventListener("click", openAdd);
    $("#saveTeamBtn").addEventListener("click", async () => {
      if (!$("#teamName").value.trim() || !$("#teamShortName").value.trim()) { toast("Team name and short name are required", "danger"); return; }
      const data = {
        tournamentId: tournament?.id || null,
        name: $("#teamName").value.trim(),
        shortName: $("#teamShortName").value.trim(),
        logoUrl: $("#teamLogoUrl").value.trim(),
        bannerUrl: $("#teamBannerUrl").value.trim(),
        primaryColor: $("#teamPrimaryColor").value,
        secondaryColor: $("#teamSecondaryColor").value,
        captain: $("#teamCaptain").value.trim(),
        viceCaptain: $("#teamViceCaptain").value.trim(),
      };
      const id = $("#teamId").value;
      try {
        if (id) await updateTeam(id, data); else await createTeam(data);
        toast("Team saved", "success");
        teamModal.hide();
        refresh();
      } catch (err) { toast(err.message, "danger"); }
    });
    $("#deleteTeamBtn").addEventListener("click", async () => {
      if (!confirmAction("Delete this team? This cannot be undone.")) return;
      await deleteTeam($("#teamId").value);
      toast("Team deleted", "success");
      teamModal.hide();
      refresh();
    });
  }

  refresh();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
